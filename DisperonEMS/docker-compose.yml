# GridMind - Local Development Stack
#
# Run with: docker-compose up -d
# Includes all cloud dependencies for local development.

version: "3.9"

services:
  # ── Databases ──────────────────────────────────────────────────────────

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: gridmind-timescaledb
    environment:
      POSTGRES_DB: gridmind_ts
      POSTGRES_USER: gridmind
      POSTGRES_PASSWORD: dev_password_change_me
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridmind"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: gridmind-postgres
    environment:
      POSTGRES_DB: gridmind
      POSTGRES_USER: gridmind
      POSTGRES_PASSWORD: dev_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridmind"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gridmind-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Messaging ──────────────────────────────────────────────────────────

  nats:
    image: nats:2-alpine
    container_name: gridmind-nats
    ports:
      - "4222:4222"   # Client
      - "8222:8222"   # Monitoring
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Auth ───────────────────────────────────────────────────────────────

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: gridmind-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/gridmind
      KC_DB_USERNAME: gridmind
      KC_DB_PASSWORD: dev_password_change_me
    ports:
      - "8080:8080"
    command: ["start-dev"]
    depends_on:
      postgres:
        condition: service_healthy

  # ── Monitoring ─────────────────────────────────────────────────────────

  grafana:
    image: grafana/grafana:latest
    container_name: gridmind-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - timescaledb

  # ── Cloud API ──────────────────────────────────────────────────────────

  api:
    build:
      context: ./cloud/api
      dockerfile: Dockerfile
    container_name: gridmind-api
    environment:
      DATABASE_URL: postgresql://gridmind:dev_password_change_me@postgres:5432/gridmind
      TIMESCALE_URL: postgresql://gridmind:dev_password_change_me@timescaledb:5432/gridmind_ts
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      KEYCLOAK_URL: http://keycloak:8080
      SECRET_KEY: dev-secret-key-change-in-production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    volumes:
      - ./cloud/api:/app

  # ── Web Dashboard ─────────────────────────────────────────────────────

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: gridmind-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./web/src:/app/src

volumes:
  postgres_data:
  timescaledb_data:
  grafana_data:
