# IEC 60870-5-104 SCADA Point Map - Cyprus EAC
#
# Defines the mapping between IEC 104 Information Object Addresses (IOA)
# and internal EMS data points for communication with EAC DSO SCADA.

common_address: 1

points:
  # ── Active Power Control ──
  - ioa: 30
    type_id: C_SE_NC_1  # Set-point command, short float
    direction: control
    internal_name: active_power_setpoint_kw
    description: "Active Power Setpoint (kW)"
    unit: kW
    scale_factor: 1.0

  - ioa: 503
    type_id: M_ME_NC_1  # Measured value, short float
    direction: monitor
    internal_name: active_power_feedback_kw
    description: "Active Power Setpoint Feedback (kW)"
    unit: kW
    deadband: 1.0

  - ioa: 103
    type_id: M_SP_NA_1  # Single-point information
    direction: monitor
    internal_name: active_power_cmd_status
    description: "Active Power Command Accepted/Rejected"

  # ── Reactive Power Control ──
  - ioa: 31
    type_id: C_SE_NC_1
    direction: control
    internal_name: reactive_power_setpoint_kvar
    description: "Reactive Power Setpoint (kVAr)"
    unit: kVAr

  - ioa: 504
    type_id: M_ME_NC_1
    direction: monitor
    internal_name: reactive_power_feedback_kvar
    description: "Reactive Power Setpoint Feedback (kVAr)"
    unit: kVAr
    deadband: 1.0

  - ioa: 104
    type_id: M_SP_NA_1
    direction: monitor
    internal_name: reactive_power_cmd_status
    description: "Reactive Power Command Accepted/Rejected"

  # ── Discrete Power Level Commands ──
  - ioa: 50
    type_id: C_SC_NA_1  # Single command
    direction: control
    internal_name: power_level_1
    description: "Power Level 1 - 100% capacity"

  - ioa: 51
    type_id: C_SC_NA_1
    direction: control
    internal_name: power_level_2
    description: "Power Level 2 - 60% capacity"

  - ioa: 52
    type_id: C_SC_NA_1
    direction: control
    internal_name: power_level_3
    description: "Power Level 3 - 30% capacity"

  - ioa: 53
    type_id: C_SC_NA_1
    direction: control
    internal_name: power_level_4
    description: "Power Level 4 - 0% (Zero Export)"

  # ── System Measurements ──
  - ioa: 100
    type_id: M_ME_NC_1
    direction: monitor
    internal_name: active_power_actual_kw
    description: "Active Power Actual (kW)"
    unit: kW
    deadband: 5.0

  - ioa: 101
    type_id: M_ME_NC_1
    direction: monitor
    internal_name: reactive_power_actual_kvar
    description: "Reactive Power Actual (kVAr)"
    unit: kVAr
    deadband: 5.0

  - ioa: 102
    type_id: M_ME_NC_1
    direction: monitor
    internal_name: frequency_hz
    description: "Grid Frequency (Hz)"
    unit: Hz
    deadband: 0.01

  - ioa: 200
    type_id: M_ME_NC_1
    direction: monitor
    internal_name: soc_percent
    description: "State of Charge (%)"
    unit: "%"
    deadband: 0.5

  - ioa: 201
    type_id: M_ME_NC_1
    direction: monitor
    internal_name: soh_percent
    description: "State of Health (%)"
    unit: "%"
    deadband: 0.1

  # ── System Status ──
  - ioa: 300
    type_id: M_SP_NA_1
    direction: monitor
    internal_name: system_ready
    description: "System Ready Status"

  - ioa: 301
    type_id: M_SP_NA_1
    direction: monitor
    internal_name: system_fault
    description: "System Fault Active"
