  <!-- ═══════ B. SIZING ═══════ -->
  <text x="30" y="420" fill="#000" font-size="12" font-weight="700">B.  Sizing &amp; Short-Circuit Verification  (690 V basis — Rev. C correction)</text>
  <g fill="#000" font-size="10">
    <text x="30" y="440">B.1  Active power: 2 × 1.25 MW = 2.50 MW.  Required S at PF 0.95 = 2.63 MVA.  Selected T2 = 3000 kVA → 14 % thermal margin. ✓</text>
    <text x="30" y="456">B.2  Full-load current (690 V): I_FL = 2500 / (√3 × 0.69) = 2090 A.  Main ACB = 2500 A → I_n / I_FL = 1.19. ✓</text>
    <text x="30" y="472">B.3  Per-branch current: I_FL = 1250 / (√3 × 0.69) = 1045 A.  Branch ACB = 1250 A → 1.19 margin. ✓</text>
    <text x="30" y="488">B.4  MV feeder current (22 kV): I_FL = 2500 / (√3 × 22) = 65.6 A.  JZ4 panel rated 630 A → 10 % loading. ✓</text>
    <text x="30" y="504">B.5  Short-circuit at 690 V LV terminals: Z_T = 0.06 × 690² / 3 000 000 = 9.52 mΩ;  Z_grid(250 MVA) = 1.90 mΩ;  Z_total = 11.42 mΩ  → I_sc ≈ 35 kA.  ACB Icu 50 kA ✓</text>
    <text x="30" y="520">B.6  NER sizing (690 V neutral): R = (690/√3) / 16 = 24.9 Ω → use 25 Ω.  Energy = 16² × 25 × 10 = 64 kJ → select 100 kJ class. ✓</text>
    <text x="30" y="536">B.7  MV cable JZ4 ↔ T2: 3 × (1×95) Cu XLPE 12/20(24) kV.  Ampacity 405 A → 6× margin on 65.6 A. ✓  (max run ~30 m assumed)</text>
    <text x="30" y="552">B.8  LV cables PCS ↔ ACB (per branch): 4 × (3×1×240 + 1×120) Cu XLPE 1 kV in parallel → ≥ 1800 A at 40 °C.  ✓  (max run ≤ 8 m)</text>
  </g>

  <!-- ═══════ D. DESIGN NOTES ═══════ -->
  <text x="30" y="770" fill="#000" font-size="12" font-weight="700">D.  Design Notes  (Rev. C)</text>
  <g fill="#000" font-size="10">
    <text x="30" y="788">1. Rev. C corrects LV bus to 690 V (matching Kehua BCS1250K-C-HUD spec per Linyang offer ref. 198/A/KT/2025). Previous Rev. B used 800 V in error.</text>
    <text x="30" y="802">2. ⚠️ BUDGET GAP: JZ4 panel + protection relay + CT/VT hardware (~€28–46 k) is not in Linyang CIF and not explicitly in EPC adder model. See pricing-verification.md.</text>
    <text x="30" y="816">3. Hybrid plant — Cyprus DSO Category B. BESS power (2.5 MW) ≤ PV power (2.5 MW). Grid charging prohibited. BESS charges from PV only per dispatch schedule.</text>
    <text x="30" y="830">4. New JZ4 panel added to existing customer Switching Substation (loop from JZ3 bus). EAC RMU side (panels 1-4) is unaffected. Confirm SM6 compatibility with existing frame.</text>
    <text x="30" y="844">5. EMS ASDU 117 (proposed). Must not conflict with existing ASDU 115 (Galascope 2 PV) and 114 (Galascope 1 PV). Coordinate with DSO before commissioning EMS.</text>
    <text x="30" y="858">6. Ref. drawings: EL00.01.01 (overall topology), EL00.01.02 (MCTS 1,2 — existing PV LV).  This SLD (LC-G25-SLD-001) covers BESS extension only.</text>
  </g>
