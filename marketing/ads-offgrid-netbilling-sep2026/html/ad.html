<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lighthief Ad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #1A365D;
      --navy-light: #2B5FA0;
      --gold: #C9A432;
      --gold-dark: #9C7D22;
      --white: #FFFFFF;
      --grey: #404040;
      --body-bg: #F0F4F8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      color: var(--navy);
      -webkit-font-smoothing: antialiased;
    }
    .ad {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }
    .photo {
      position: absolute;
      inset: 0;
      background-color: #dce6ef;
      background-size: cover;
      background-repeat: no-repeat;
    }
    .panel {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo-circle { flex-shrink: 0; display: block; }
    .logo-text { display: flex; flex-direction: column; }
    .logo-word {
      font-family: "Barlow Condensed", "Segoe UI", sans-serif;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: var(--navy);
      line-height: 1;
    }
    .brand-sub {
      color: var(--navy);
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.8;
    }
    .tagline {
      text-align: right;
      color: var(--navy);
      font-weight: 700;
      line-height: 1.15;
    }
    .copy { display: flex; flex-direction: column; flex: 1; }
    .eyebrow {
      color: var(--navy);
      font-weight: 700;
      letter-spacing: 0.03em;
      word-spacing: 0.06em;
      text-transform: uppercase;
    }
    h1 {
      font-family: "Barlow Condensed", "Segoe UI", sans-serif;
      font-weight: 800;
      line-height: 0.92;
      letter-spacing: 0.01em;
      word-spacing: 0.1em;
      text-transform: uppercase;
    }
    h1 .gold { color: var(--gold); }
    h1 .navy { color: var(--navy); }
    .sub {
      color: var(--grey);
      font-weight: 500;
      line-height: 1.4;
      word-spacing: 0.04em;
      max-width: 22em;
    }
    .benefits {
      display: flex;
      flex-wrap: wrap;
      list-style: none;
    }
    .benefits li {
      display: flex;
      align-items: center;
      color: var(--navy);
      font-weight: 600;
    }
    .benefits svg { flex-shrink: 0; }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 0.45em;
      background: var(--navy);
      color: #fff;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-decoration: none;
      white-space: nowrap;
    }
    .cta .arrow { color: var(--gold); font-weight: 800; }
    .signoff {
      font-family: Caveat, cursive;
      color: var(--navy);
      line-height: 1.05;
      text-align: right;
    }
    .site {
      color: var(--grey);
      font-weight: 600;
    }

    /* ===== SPLIT: square / portrait / landscape ===== */

    .size-1200x1200 h1 { font-size: 94px; }
    .size-1200x1200 .sub { font-size: 22px; }
    .size-1200x1200 .benefits { gap: 14px 24px; margin-top: 10px; }
    .size-1200x1200 .benefits li { font-size: 15px; gap: 8px; }
    .size-1200x1200 .benefits svg { width: 20px; height: 20px; }
    .size-1200x1200 .cta { font-size: 17px; padding: 18px 28px; border-radius: 8px; }
    .size-1200x1200 .signoff { font-size: 34px; }
    .size-1200x1200 .footer { margin-top: auto; padding-top: 22px; }

    .size-1080x1350 .panel { width: 60%; padding: 5% 4% 5% 6%; }
    .size-1080x1350 .logo-circle { width: 42px; height: 42px; }
    .size-1080x1350 .logo-word { font-size: 28px; }
    .size-1080x1350 .brand-sub { font-size: 8px; margin-top: 5px; }
    .size-1080x1350 .tagline { font-size: 16px; max-width: 170px; }
    .size-1080x1350 .copy { padding-top: 56px; gap: 20px; }
    .size-1080x1350 .eyebrow { font-size: 16px; }
    .size-1080x1350 h1 { font-size: 84px; }
    .size-1080x1350 .sub { font-size: 22px; }
    .size-1080x1350 .benefits { flex-direction: column; gap: 14px; margin-top: 16px; }
    .size-1080x1350 .benefits li { font-size: 16px; gap: 10px; }
    .size-1080x1350 .benefits svg { width: 20px; height: 20px; }
    .size-1080x1350 .cta { font-size: 16px; padding: 16px 26px; border-radius: 8px; }
    .size-1080x1350 .signoff { font-size: 32px; }
    .size-1080x1350 .footer { margin-top: auto; flex-direction: column; align-items: flex-start; gap: 18px; }

    .size-960x1200 .panel { width: 60%; padding: 5% 4% 5% 6%; }
    .size-960x1200 .logo-circle { width: 36px; height: 36px; }
    .size-960x1200 .logo-word { font-size: 24px; }
    .size-960x1200 .brand-sub { font-size: 7px; margin-top: 4px; }
    .size-960x1200 .tagline { font-size: 14px; max-width: 150px; }
    .size-960x1200 .copy { padding-top: 48px; gap: 16px; }
    .size-960x1200 .eyebrow { font-size: 14px; }
    .size-960x1200 h1 { font-size: 74px; }

    .size-960x1200 .benefits { flex-direction: column; gap: 12px; margin-top: 12px; }
    .size-960x1200 .benefits li { font-size: 14px; gap: 8px; }
    .size-960x1200 .benefits svg { width: 18px; height: 18px; }
    .size-960x1200 .cta { font-size: 14px; padding: 14px 22px; border-radius: 8px; }
    .size-960x1200 .signoff { font-size: 28px; }
    .size-960x1200 .footer { margin-top: auto; flex-direction: column; align-items: flex-start; gap: 16px; }

    .size-1920x1080 .panel { width: 48%; padding: 3.4% 2% 3.2% 4%; background: linear-gradient(90deg, #fff 0%, #fff 78%, rgba(255,255,255,0) 100%); }
    .size-1920x1080 .photo { background-position: 72% center; }
    .size-1920x1080 .logo-circle { width: 44px; height: 44px; }
    .size-1920x1080 .logo-word { font-size: 30px; }
    .size-1920x1080 .brand-sub { font-size: 9px; margin-top: 5px; }
    .size-1920x1080 .tagline { font-size: 16px; max-width: 180px; }
    .size-1920x1080 .copy { padding-top: 36px; gap: 16px; }
    .size-1920x1080 .eyebrow { font-size: 16px; }
    .size-1920x1080 h1 { font-size: 84px; }
    .size-1920x1080 .sub { font-size: 22px; max-width: 18em; }
    .size-1920x1080 .benefits { gap: 12px 28px; margin-top: 8px; }
    .size-1920x1080 .benefits li { font-size: 15px; gap: 8px; }
    .size-1920x1080 .benefits svg { width: 18px; height: 18px; }
    .size-1920x1080 .cta { font-size: 17px; padding: 16px 28px; border-radius: 8px; }
    .size-1920x1080 .signoff { font-size: 34px; }

    /* 1.91:1 landscape */

    .size-1200x628 .signoff { font-size: 22px; }
    .size-1200x628 .footer { margin-top: auto; }

    /* ===== STORIES / REELS 9:16 ===== */
    .layout-story .photo { background-position: center 62%; }
    .layout-story .panel {
      position: static;
      width: 100%;
      height: auto;
      padding: 13% 7% 0;
      background: linear-gradient(180deg, #fff 0%, #fff 72%, rgba(255,255,255,0) 100%);
    }
    .layout-story .header,
    .layout-story .copy { position: relative; z-index: 2; }
    .layout-story .header { margin-bottom: 18px; }
    .layout-story::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 26%;
      background: linear-gradient(180deg, rgba(26,54,93,0) 0%, rgba(26,54,93,0.5) 100%);
      z-index: 1;
      pointer-events: none;
    }
    .size-1080x1920 .logo-circle { width: 40px; height: 40px; }
    .size-1080x1920 .logo-word { font-size: 26px; }
    .size-1080x1920 .brand-sub { font-size: 8px; margin-top: 5px; }
    .size-1080x1920 .tagline { font-size: 16px; max-width: 170px; }

    .size-1080x1920 .eyebrow { font-size: 16px; }

    .size-1080x1920 .sub { font-size: 22px; max-width: 16em; }
    .size-1080x1920 .benefits { gap: 10px 20px; }
    .size-1080x1920 .benefits li { font-size: 15px; gap: 8px; }
    .size-1080x1920 .benefits svg { width: 18px; height: 18px; }
    .layout-story .footer {
      position: absolute;
      left: 7%;
      right: 7%;
      bottom: 16%;
      z-index: 3;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .size-1080x1920 .cta { font-size: 16px; padding: 16px 26px; border-radius: 8px; }
    .size-1080x1920 .signoff { font-size: 32px; text-align: left; color: #fff; text-shadow: 0 2px 14px rgba(0,0,0,0.45); }

    /* ===== GOOGLE BOX ===== */
    .layout-box { background: #fff; }
    .layout-box .photo {
      left: auto;

      height: 100%;

    }

    .layout-box .benefits,
    .layout-box .signoff { display: none; }

    .size-300x250 .logo-circle { width: 18px; height: 18px; }
    .size-300x250 .logo-word { font-size: 13px; }

    .size-300x250 .cta { font-size: 9px; padding: 7px 10px; border-radius: 4px; }
    .size-336x280 .logo-circle { width: 20px; height: 20px; }

    /* ===== LEADER / MOBILE ===== */

    .layout-leader .benefits,

    .layout-leader .footer { margin: 0; }
    .size-728x90 .logo-circle { width: 26px; height: 26px; }

    .size-728x90 h1 { font-size: 26px; }

    .size-970x250 .panel { padding: 0 28px; width: 74%; }

<body>
  <div class="ad" id="ad">
    <div class="photo" id="photo"></div>
    <div class="panel">
      <header class="header">
        <div class="brand">
          <svg class="logo-circle" viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="24" cy="24" r="17" fill="none" stroke="#C9A432" stroke-width="5"/>
          </svg>
          <div class="logo-text">
            <div class="logo-word">LIGHTHIEF</div>
            <div class="brand-sub">Energy independence for Cyprus</div>
          </div>
        </div>
        <div class="tagline">A Brighter<br>More Independent<br>Cyprus</div>
      </header>
      <div class="copy">
        <div class="eyebrow" id="eyebrow"></div>
        <h1 id="headline"></h1>
        <p class="sub" id="sub"></p>
        <ul class="benefits" id="benefits"></ul>
      </div>
      <footer class="footer">
        <div class="cta">Get a free consultation <span class="arrow">→</span></div>
        <div class="signoff" id="signoff"></div>
      </footer>
    </div>
  </div>
  <script>
    const ICONS = {
      bolt: '<svg viewBox="0 0 24 24" fill="none" stroke="#1A365D" stroke-width="2"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg>',
      cal: '<svg viewBox="0 0 24 24" fill="none" stroke="#1A365D" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
      home: '<svg viewBox="0 0 24 24" fill="none" stroke="#1A365D" stroke-width="2"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9z"/></svg>',
      leaf: '<svg viewBox="0 0 24 24" fill="none" stroke="#1A365D" stroke-width="2"><path d="M5 19c8 0 14-6 14-14-8 0-14 6-14 14z"/><path d="M5 19c4-4 7-8 9-13"/></svg>',
      coin: '<svg viewBox="0 0 24 24" fill="none" stroke="#1A365D" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 7v10M9.5 9.5c.6-1 1.6-1.5 2.5-1.5s2 .6 2 1.8-1 1.7-2.4 2.1c-1.5.4-2.6 1-2.6 2.3 0 1.3 1.2 2 2.6 2s2.1-.5 2.6-1.4"/></svg>',
      shop: '<svg viewBox="0 0 24 24" fill="none" stroke="#1A365D" stroke-width="2"><path d="M4 9l1.5-5h13L20 9M4 9h16v10H4V9z"/><path d="M9 19v-6h6v6"/></svg>',
      check: '<svg viewBox="0 0 24 24" fill="none" stroke="#1A365D" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M8 12l3 3 5-6"/></svg>',
      sun: '<svg viewBox="0 0 24 24" fill="none" stroke="#1A365D" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>',
      bat: '<svg viewBox="0 0 24 24" fill="none" stroke="#1A365D" stroke-width="2"><rect x="6" y="7" width="12" height="14" rx="2"/><path d="M10 4h4v3h-4zM10 12h4"/></svg>'
    };

    const CREATIVES = {
      'og-home-a': {
        audience: 'home',
        bg: 'villa',
        eyebrow: 'Tired of power cuts? Rising electricity prices?',
        lines: [
          { t: 'Go full', c: 'navy' },
          { t: 'off-grid.', c: 'gold' }
        ],
        short: [
          { t: 'Go full', c: 'navy' },
