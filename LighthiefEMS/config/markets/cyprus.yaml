# GridMind Market Configuration - Cyprus
#
# Grid code: EN 50549-2 / EAC Requirements
# DSO: EAC (Electricity Authority of Cyprus)
# TSO: TSOC (Transmission System Operator of Cyprus)
#
# MMS Reference: Market Participant Interfaces V1.3 (May 2023)

market:
  name: "Cyprus"
  code: "CY"
  dso: "EAC"
  tso: "TSOC"
  timezone: "Asia/Nicosia"  # EET (UTC+2 / UTC+3 DST)
  currency: "EUR"

# ─── MMS (Market Management System) Configuration ─────────────────────────────
# Source: Market Participant Interfaces Technical Description V1.3
mms:
  # SOAP endpoint for MMS integration (to be provided by TSOC)
  soap_endpoint: ""  # e.g. https://mms.tsoc.org.cy/ws
  wsdl_url: ""       # WSDL for web service interfaces

  # EIC Codes (Energy Identification Codes) - from TSOC registration
  eic_codes:
    cyprus_control_area: ""  # Cyprus Control Area EIC
    tsoc: ""                 # TSOC EIC Code (receiver for all submissions)
    participant: ""          # Our market participant EIC
    # Resource EIC codes mapped per BESS unit
    resources: {}
    # Example:
    #   bess_unit_1: "EIC_CODE_HERE"
    #   bess_unit_2: "EIC_CODE_HERE"

  # CIM XML Schema files
  xsd_schemas:
    schedule: "iec62325-451-2-schedule_v5_1.xsd"
    reserve_bid: "iec62325-451-7-reservebiddocument_v7_1.xsd"
    settlement: "iec62325-451-4-settlement_v4_0.xsd"
    auction_spec: "iec62325-451-3-auctionspecification_v7_1.xsd"
    acknowledgement: "iec62325-451-1-acknowledgement_v7_0.xsd"
    techno_economic: "participant-techno-economic-declaration-v2r1.xsd"
    anomaly: "iec62325-451-2-anomaly_v5_0.xsd"
    confirmation: "iec62325-451-2-confirmation_v5_01.xsd"
  common_xsd:
    - "urn-entsoe-eu-wgedi-codelists.xsd"
    - "urn-entsoe-eu-wgedi-components.xsd"
    - "urn-entsoe-eu-local-extension-types.xsd"

# ─── Market Trading Parameters ────────────────────────────────────────────────
trading:
  # Day-Ahead Market
  dam:
    resolution_minutes: 30        # PT30M - 48 periods per trading day
    periods_per_day: 48
    message_type: "Z02"           # DAM bid document
    process_type: "A01"           # Day Ahead
    sender_role: "A27"            # Resource Provider
    receiver_role: "A11"          # Market Operator

    # Order types
    simple_offer:
      business_type: "Z04"
      flow_direction: "A01"       # Up (sell)
      max_priority_steps: 10
      divisible: true
      price_unit: "EUR/MWh"
      price_decimals: 2
      quantity_unit: "MWh"
      quantity_decimals: 3
    block_offer:
      business_type: "Z05"
      flow_direction: "A01"       # Up (sell)
      max_per_resource_per_day: 10
      max_linked_levels: 3        # father-son-grandson
      divisible: true
      min_acceptance_ratio: true
    simple_bid:
      business_type: "Z06"
      flow_direction: "A02"       # Down (buy)
      max_priority_steps: 10
      divisible: true

    # Price limits (from standing data - to be populated)
    energy_offer_cap_eur_mwh: null       # Standing data: DAM Energy Offer Cap
    minimum_variable_cost: null           # From TED schedule

  # Balancing Market
  balancing:
    # Balancing Energy Offers (BEO)
    energy_offers:
      message_type: "A37"         # Reserve tender document
      process_type: "A41"         # Redispatch Process
      business_type: "A86"        # Control area balance energy
      resolution_minutes: 30      # PT30M
      max_priority_steps: 10
      price_decimals: 2           # EUR/MWh
      quantity_decimals: 3        # MWh

      # Price limits (from standing data - to be populated)
      beo_cap_up_eur_mwh: null    # Standing data: BM.BEO_CAP_UP
      beo_min_up_eur_mwh: null    # Standing data: BM.BEO_MIN_UP

    # Reserve Capacity Offers (RCO)
    reserve_capacity:
      message_type: "A32"         # Proposed capacity
      resolution_minutes: 30      # PT30M
      max_priority: 1             # Only 1 offer per resource/direction/commodity

      fcr:
        process_type: "A52"       # Frequency containment reserve
        business_type: "A95"
        quantity_unit: "MAW"      # MW
        price_unit: "EUR/MAW"
        enabled: true
      afrr:
        process_type: "A51"       # Automatic frequency restoration reserve
        business_type: "A96"
        quantity_unit: "MAW"
        price_unit: "EUR/MAW"
        enabled: true
      mfrr:
        process_type: "A47"       # Manual frequency restoration reserve
        business_type: "A97"
        quantity_unit: "MAW"
        price_unit: "EUR/MAW"
        enabled: true

      # Reserve offer caps (from standing data - to be populated)
      fcr_offer_cap_eur_mw: null
      afrr_offer_cap_eur_mw: null
      mfrr_offer_cap_eur_mw: null

    # Real-Time Balancing Market
    rtbm:
      resolution_minutes: 5       # PT5M
      dispatch_instruction_type: "Z14"
      dispatch_business_types:
        startup: "Z16"
        shutdown: "Z17"
        ramp_rate: "Z18"          # MAW
        agc: "Z19"
        dispatch_mw_gross: "Z32"  # MAW - primary setpoint
        dispatch_mw_net: "Z33"    # MAW - net setpoint
        fcr_up: "Z24"
        fcr_down: "Z25"
        afrr_up: "Z26"
        afrr_down: "Z27"
        mfrr_up: "Z28"
        mfrr_down: "Z29"
        rr_up: "Z30"
        rr_down: "Z31"

  # Long-Term Reserve Auctions
  reserves:
    replacement_reserve:
      business_type: "A98"
      message_type: "A24"         # Bid document
      process_type: "A12"         # Long Term
      auction_period: "monthly"
      resolution_minutes: 30      # PT30M
      divisible: true
      max_priority_steps: 10
      direction: "both"           # Up (A01) and Down (A02)
      rr_offer_cap_eur_mw: null   # Standing data
    contingency_reserve:
      business_type: "B55"
      message_type: "A24"
      process_type: "A12"
      auction_period: "yearly"
      resolution: "P1Y"
      divisible: true
      priority: 1
      direction: "up"             # A01 only
      cr_offer_cap_eur_mw: null
    black_start:
      business_type: "Z07"
      message_type: "A24"
      process_type: "A12"
      auction_period: "yearly"
      resolution: "P1Y"
      divisible: false
      priority: 1
      direction: "up"             # A01 only
      bs_offer_cap_eur_mw: null

  # Forward Market
  forward:
    # Physical Delivery/Offtake Nominations
    nominations:
      message_type: "A14"        # Resource Schedule
      process_type: "Z01"        # Forward Market
      resolution_minutes: 30     # PT30M
      pdn_business_type: "A01"   # Production
      pon_business_type: "A04"   # Consumption
    # Forward Contract Nominations (OTC)
    fcn:
      message_type: "Z03"
      process_type: "Z01"        # Forward Market
      business_type: "A30"       # Internal inter area trade

  # Gate Closure Schedule (all times in EET)
  gate_closures:
    ted: "D-1 16:00"                    # Techno-Economic Declaration
    pdn_pon_initial: "D-1 09:00"        # Physical Delivery/Offtake initial
    pdn_pon_final: "D-1 09:15-10:00"    # Physical Delivery/Offtake final
    fcn: "D-1 09:00"                    # Forward Contract Nominations
    res_forecast: "D-1 11:00"           # RES Injection Forecast
    rr_nomination: "D-1 09:00"          # RR Quantity Nominations
    nad_min_lead_time_minutes: 30       # Non-availability Declaration

  # Settlement
  settlement:
    statement_types:
      dam: "Z20"                 # DAM Statement
      imbalance: "Z21"           # Imbalance Statement
      ancillary: "Z22"           # Ancillary Services Statement
      uplift: "Z25"              # Uplift Statement
      non_compliance: "Z26"      # Non-Compliance Charges
      reconciliation: "Z27"      # Reconciliation Statement
      aggregate: "Z28"           # Aggregate Settlement
    notice_types:
      dam: "Z30"
      imbalance: "Z31"
      ancillary: "Z32"
      tuos: "Z33"
      duos: "Z34"
      uplift: "Z35"
      non_compliance: "Z36"
      reconciliation: "Z37"
      aggregate: "Z38"
    process_types:
      settlement: "Z02"
      billing: "Z03"

# ─── Grid Parameters ──────────────────────────────────────────────────────────
grid:
  nominal_frequency_hz: 50.0
  nominal_voltage_lv_v: 230.0
  nominal_voltage_mv_v: 11000.0

protection:
  undervoltage_stage1:
    threshold_pu: 0.9
    time_s: 0.2
  overvoltage_stage1:
    threshold_pu: 1.1
    time_s: 0.2
  underfrequency_stage1:
    threshold_hz: 47.0
    time_s: 0.2
  overfrequency_stage1:
    threshold_hz: 52.0
    time_s: 0.2

lfsm_o:
  activation_hz: 50.2
  droop_per_hz: 1.0  # 100% PM per Hz
  bess_transition_hz: 50.7
  max_charging_hz: 52.0
  recovery_rate_per_min: 0.1  # 10% PAmax per minute

qu_curve:
  # Discharging mode Q(U) curve
  # voltage_pu, q_fraction (positive = capacitive, negative = inductive)
  points:
    - [0.92, 0.40]   # +40% capacitive
    - [0.97, 0.00]   # deadband start
    - [1.00, 0.00]   # reference
    - [1.03, 0.00]   # deadband end
    - [1.07, -0.40]  # -40% inductive

# ─── SCADA ────────────────────────────────────────────────────────────────────
scada:
  protocol: "IEC 60870-5-104"
  port: 2404
  common_address: 1

discrete_power_levels:
  level_1: 1.00  # 100% - normal operation
  level_2: 0.60  # 60% - grid congestion
  level_3: 0.30  # 30% - high congestion
  level_4: 0.00  # 0% - emergency curtailment

# ─── BESS Categories ──────────────────────────────────────────────────────────
bess_categories:
  category_a:
    description: "Self-Consumption RES with BESS"
    scada_required: false
    max_capacity_kw: 120
    charging_source: "RES only"
  category_b:
    description: "RES with Integrated Storage (Hybrid)"
    scada_required: true
    min_capacity_kw: 120
    charging_source: "RES only"
  category_c:
    description: "Standalone Storage Facility (EAH)"
    scada_required: true
    min_capacity_kw: 120
    charging_source: "Grid and/or RES"

# ─── DSO Response Requirements ────────────────────────────────────────────────
response_times:
  command_acknowledgment_s: 3.0
  power_adjustment_s: 60.0
  min_command_interval_s: 20.0
  control_accuracy_percent: 2.0

# ─── Smart Maintenance Configuration ────────────────────────────────────────
maintenance:
  # Alarm severity escalation rules
  escalation:
    levels:
      L1_INFO:
        response_sla_minutes: null      # No SLA
        contact_method: null            # Dashboard only
        auto_escalate_after_minutes: null
        auto_create_work_order: false
      L2_WARNING:
        response_sla_minutes: 240       # 4 hours
        contact_method: "push"          # Push notification
        auto_escalate_after_minutes: 120 # Escalate if no response in 2h
        auto_create_work_order: false
      L3_ALARM:
        response_sla_minutes: 60        # 1 hour
        contact_method: "call"          # Phone call
        auto_escalate_after_minutes: 15  # Escalate if no response in 15min
        auto_create_work_order: true
      L4_CRITICAL:
        response_sla_minutes: 15        # 15 minutes
        contact_method: "call"          # Phone call
        auto_escalate_after_minutes: 5   # Escalate if no response in 5min
        auto_create_work_order: true
        notify_backup: true             # Also notify backup engineer
      L5_EMERGENCY:
        response_sla_minutes: 5         # 5 minutes
        contact_method: "call"          # Phone call
        auto_escalate_after_minutes: 2   # Escalate immediately
        auto_create_work_order: true
        notify_all: true                # Notify ALL on-call + manager + DSO
        dso_notification: true          # Notify DSO/TSO

    # Call verification settings
    call_verification:
      max_attempts: 3                   # Retry call up to 3 times
      retry_interval_seconds: 60        # Wait 60s between retries
      require_confirmation: true        # Engineer must confirm pickup
      confirmation_methods:
        - "app_confirm"                 # In-app confirmation button
        - "dtmf"                        # Press 1 to confirm (IVR)
        - "callback"                    # Call back to confirm
        - "manual"                      # Operator manually confirms
      missed_call_escalation: true      # Auto-escalate on missed call

  # Notification channels
  notifications:
    push:
      enabled: true
      provider: "firebase"              # FCM for push notifications
    sms:
      enabled: true
      provider: "twilio"
    call:
      enabled: true
      provider: "twilio"
      ivr_script: "GridMind Alert: {severity} alarm at {site}. {message}. Press 1 to acknowledge."
    email:
      enabled: true
      smtp_from: "alerts@gridmind.com"

  # Engineer tracking
  engineer_tracking:
    gps_update_interval_seconds: 30     # Mobile app GPS update frequency
    location_accuracy_meters: 50        # Required GPS accuracy
    auto_on_site_radius_meters: 200     # Auto-detect arrival within 200m of site
    stale_location_timeout_minutes: 15  # Location data considered stale after 15min

  # Preventive maintenance schedules
  preventive_schedules:
    coolant_inspection:
      recurrence: "quarterly"
      estimated_hours: 4
      checklist:
        - "Check coolant level and top up if needed"
        - "Inspect coolant flow rate (target: >10 L/min)"
        - "Check filter condition, replace if pressure drop >0.5 bar"
        - "Inspect pump operation and noise level"
        - "Check all hose connections for leaks"
        - "Record inlet/outlet temperatures"
    bms_health_check:
      recurrence: "monthly"
      estimated_hours: 2
      checklist:
        - "Review cell voltage spread across all strings"
        - "Check cell temperature uniformity"
        - "Verify SOC/SOH readings against reference"
        - "Review alarm history for BMS faults"
        - "Check communication status (Modbus registers)"
    pcs_inspection:
      recurrence: "semi_annual"
      estimated_hours: 6
      checklist:
        - "Inspect AC and DC connections for torque"
        - "Check capacitor condition (visual + ESR if available)"
        - "Verify fan operation and clean filters"
        - "Review PCS fault logs"
        - "Check insulation resistance"
        - "Verify protection relay settings"
    hv_switching_test:
      recurrence: "annual"
      estimated_hours: 8
      checklist:
        - "Test MV circuit breaker operation"
        - "Verify protection relay trip test"
        - "Check transformer oil level and condition"
        - "Verify earthing system integrity"
        - "Test emergency stop functionality"
        - "Calibrate revenue meters"
    site_general_inspection:
      recurrence: "monthly"
      estimated_hours: 3
      checklist:
        - "Check container HVAC operation"
        - "Inspect fire suppression system"
        - "Verify CCTV and access control"
        - "Check perimeter fence and signage"
        - "Review environmental monitoring (humidity, dust)"
        - "Check UPS and backup power"

  # Predictive maintenance thresholds (triggers from BSM analytics)
  predictive_thresholds:
    cell_voltage_spread_mv: 80          # Trigger maintenance if spread > 80mV
    soh_acceleration_factor: 1.5        # Trigger if degradation 1.5x faster than expected
    thermal_efficiency_drop_percent: 15 # Trigger if cooling efficiency drops 15%
    communication_failure_count: 5      # Trigger after 5 communication failures in 24h

  # SLA reporting
  sla_reporting:
    dashboard_refresh_seconds: 30
    compliance_target_percent: 95.0     # Target: 95% of work orders within SLA
    report_generation: "weekly"
    report_recipients:
      - "operations@gridmind.com"
      - "management@gridmind.com"
