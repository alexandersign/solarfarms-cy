# GridMind Market Configuration - Greece
#
# Grid code: Greek Grid Code / EN 50549
# DSO: HEDNO (Hellenic Electricity Distribution Network Operator)
# TSO: ADMIE (Independent Power Transmission Operator)
# Exchange: HEnEx (Hellenic Energy Exchange)

market:
  name: "Greece"
  code: "GR"
  dso: "HEDNO"
  tso: "ADMIE"
  timezone: "Europe/Athens"
  currency: "EUR"

grid:
  nominal_frequency_hz: 50.0
  nominal_voltage_lv_v: 230.0
  nominal_voltage_mv_v: 20000.0

protection:
  undervoltage_stage1:
    threshold_pu: 0.85
    time_s: 1.5
  overvoltage_stage1:
    threshold_pu: 1.10
    time_s: 0.2
  underfrequency_stage1:
    threshold_hz: 47.5
    time_s: 0.5
  overfrequency_stage1:
    threshold_hz: 51.5
    time_s: 0.5

lfsm_o:
  activation_hz: 50.2
  droop_per_hz: 0.4
  recovery_rate_per_min: 0.2

trading:
  exchange: "HEnEx"
  bidding_zone: "10YGR-HTSO-----Y"
  gate_closure_da_minutes: 720
  gate_closure_id_minutes: 60
  products:
    day_ahead:
      resolution_minutes: 60
      block_bids: true
    intraday:
      continuous: true
      auction: true
      resolution_minutes: 15
  balancing:
    fcr:
      enabled: true
      product_length_hours: 4
      symmetric: true
    afrr:
      enabled: true
      activation_time_s: 300
    mfrr:
      enabled: true
      activation_time_s: 750
