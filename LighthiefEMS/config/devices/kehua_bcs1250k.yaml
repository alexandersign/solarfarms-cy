# Kehua BCS1250K-C-HUD PCS Configuration
#
# Modbus TCP register map and operational parameters
# Based on Kehua Modbus Communication Protocol document

device:
  manufacturer: "Xiamen Kehua Digital Energy"
  model: "BCS1250K-C-HUD"
  driver: "kehua_bcs1250k"
  protocol: "modbus_tcp"

connection:
  default_port: 502
  default_unit_id: 1
  timeout_ms: 3000
  poll_interval_ms: 1000
  max_retries: 3

ratings:
  rated_power_kw: 1250
  max_power_kva: 1375
  dc_voltage_range_v: [1060, 1500]
  max_dc_current_a: 1403
  ac_voltage_v: 690
  max_ac_current_a: 1150.6
  max_efficiency: 0.99
  power_factor_rated: 0.99
  thdi_rated: 0.03

modbus_registers:
  holding:
    active_power_setpoint:
      address: 0       # 40001-40002
      type: float32
      unit: kW
      rw: true
    reactive_power_setpoint:
      address: 2       # 40003-40004
      type: float32
      unit: kVAr
      rw: true
    operating_mode:
      address: 4       # 40005
      type: uint16
      rw: true
      values:
        0: standby
        1: pq
        2: vf
        3: vsg
        4: droop
    start_stop:
      address: 5       # 40006
      type: uint16
      rw: true
      values:
        0: stop
        1: start

  input:
    active_power:
      address: 0       # 30001-30002
      type: float32
      unit: kW
    reactive_power:
      address: 2       # 30003-30004
      type: float32
      unit: kVAr
    dc_voltage:
      address: 4       # 30005-30006
      type: float32
      unit: V
    dc_current:
      address: 6       # 30007-30008
      type: float32
      unit: A
    ac_voltage:
      address: 8       # 30009-30010
      type: float32
      unit: V
    ac_current:
      address: 10      # 30011-30012
      type: float32
      unit: A
    frequency:
      address: 12      # 30013-30014
      type: float32
      unit: Hz
    power_factor:
      address: 14      # 30015
      type: float32
    pcs_status:
      address: 15      # 30016
      type: uint16
    fault_code:
      address: 16      # 30017
      type: uint16

grid_forming:
  vsg: true
  black_start: true
  vf_mode: true
  pq_mode: true
  multi_mode_switching: true
  response_time: "millisecond"
