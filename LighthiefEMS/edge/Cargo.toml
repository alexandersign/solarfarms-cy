[workspace]
members = [
    "common",
    "drivers/generic-driver",
    "drivers/modbus-driver",
    "drivers/iec61850-driver",
    "scada-gateway",
    "ems-core",
    "edge-agent",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["GridMind Energy <dev@gridmind.com>"]
license = "Proprietary"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
tokio-modbus = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2.0"
anyhow = "1.0"
async-trait = "0.1"
prost = "0.13"
tonic = "0.12"
uuid = { version = "1.11", features = ["v4", "serde"] }
async-nats = "0.38"
rusqlite = { version = "0.32", features = ["bundled"] }
config = "0.14"
dashmap = "6.1"
parking_lot = "0.12"
bytes = "1.9"
