# ─────────────────────────────────────────────────────────────────────────────
# TSOC Market Data Daily Fetcher
# ─────────────────────────────────────────────────────────────────────────────
#
# Runs daily at 14:00 UTC (4 PM Cyprus time) - after TSOC publishes
# day-ahead reports. Downloads new Excel files, processes them into
# market-data.json, and commits the update.
#
# Required for CI (Cloudflare blocks GitHub Actions IPs):
#   SCRAPINGBEE_API_KEY — https://www.scrapingbee.com (free tier ~1000 req/mo)
#
# Optional:
#   ZENROWS_API_KEY, PROXY_URL
# ─────────────────────────────────────────────────────────────────────────────

name: Fetch TSOC Market Data

on:
  schedule:
    - cron: '0 14 * * *'

  workflow_dispatch:
    inputs:
      backfill:
        description: 'Backfill all data since Oct 2025 (not just latest)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  fetch-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install project dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore Excel cache
        uses: actions/cache@v4
        with:
          path: market/excel
          key: tsoc-excel-${{ github.run_id }}
          restore-keys: |
            tsoc-excel-

      - name: Check Excel cache status
        id: cache-check
        run: |
          EXCEL_COUNT=$(find market/excel -name '*.xlsx' -o -name '*.xls' 2>/dev/null | wc -l)
          echo "excel_count=$EXCEL_COUNT" >> $GITHUB_OUTPUT
          if [ "$EXCEL_COUNT" -lt 10 ]; then
            echo "needs_backfill=true" >> $GITHUB_OUTPUT
            echo "⚠️  Only $EXCEL_COUNT Excel files found — cache likely expired. Will backfill."
          else
            echo "needs_backfill=false" >> $GITHUB_OUTPUT
            echo "✓ Cache restored with $EXCEL_COUNT Excel files."
          fi

      - name: Fetch TSOC Excel files
        run: |
          BACKFILL_FLAG=""
          if [ "${{ github.event.inputs.backfill }}" = "true" ] || [ "${{ steps.cache-check.outputs.needs_backfill }}" = "true" ]; then
            BACKFILL_FLAG="--backfill"
            echo "📥 Running in BACKFILL mode (fetching all data since Oct 2025)"
          else
            echo "📥 Running in INCREMENTAL mode (fetching latest files only)"
          fi
          if [ -z "${{ secrets.SCRAPINGBEE_API_KEY }}" ] && [ -z "${{ secrets.ZENROWS_API_KEY }}" ]; then
            echo "::warning::SCRAPINGBEE_API_KEY not set — CI fetch may fail behind Cloudflare. Add it in repo Settings → Secrets."
          fi
          npx ts-node --compiler-options '{"module":"commonjs"}' \
            scripts/fetch-tsoc-playwright.ts $BACKFILL_FLAG
        env:
          TSOC_BACKFILL: ${{ github.event.inputs.backfill }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}

      - name: Process Excel files into market-data.json
        run: |
          npx ts-node --compiler-options '{"module":"commonjs"}' \
            scripts/download-market-data.ts --parse-only

      - name: Commit updated market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add market/data/market-data.json

          if git diff --staged --quiet; then
            echo "::notice::No new market data to commit"
          else
            DATES=$(git diff --staged -- market/data/market-data.json | grep '"end"' | tail -1 | grep -oP '\d{4}-\d{2}-\d{2}' || echo "unknown")
            git commit -m "$(cat <<EOF
chore: update TSOC market data through ${DATES}

Automated daily fetch from tsoc.org.cy (REP_MO-003 / S3)
EOF
)"
            git push
            echo "::notice::Market data updated and pushed"
          fi

      - name: Report failure
        if: failure()
        run: |
          echo "::error::Market data fetch failed. Check logs above."
          echo "Add SCRAPINGBEE_API_KEY to GitHub secrets, or run locally:"
          echo "  curl -sL TSOC_URL -o market/tsoc-index.html"
          echo "  npm run market:fetch -- --index-html market/tsoc-index.html"
          echo "  npm run market:parse"
