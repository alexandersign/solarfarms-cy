# StochRSI BTC daily bot — default config

symbol: BTCUSDT
interval: 1d

# long_only | short_only | both (one position at a time)
mode: long_only

stoch_rsi:
  rsi_len: 14
  stoch_len: 14
  smooth_k: 3
  smooth_d: 3

levels:
  overbought: 75
  oversold: 25
  entry_long: 25
  exit_long: 75
  entry_short: 75
  exit_short: 25
  lookback_bars: 30

trail:
  callback_pct: 2.0

leverage: 10
margin_type: ISOLATED
position_mode: ONE_WAY
compound: true

optional:
  min_bars_since_ob: 0
  friday_close_if_losing: true
  friday_check_utc_hour: 20

fees:
  taker_rate: 0.0005

risk:
  min_equity_usdt: 50
  max_drawdown_pct: 40
  max_daily_loss_pct: 15
  kill_switch_file: STOP

exchange:
  testnet_base_url: https://testnet.binancefuture.com
  mainnet_base_url: https://fapi.binance.com
